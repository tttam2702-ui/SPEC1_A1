<!doctype html>
<html lang="en">
  <!-- SPDX-License-Identifier: GPL-3.0-or-later -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claim Your Offer — ME-MARRT</title>
    <script src="p5.js"></script>
    <script src="challenge-audio.js?v=academic-1"></script>
    <link rel="stylesheet" href="style.css?v=academic-1" />
    <link rel="stylesheet" href="site-shell.css?v=academic-1" />
    <link rel="stylesheet" href="offer-wheel.css?v=academic-1" />
    <script src="site-shell.js?v=academic-1" defer></script>
  </head>
  <body>
    <main class="offer-stage" id="offer-stage" data-site-stage>
      <div class="offer-heading">
        <p class="offer-eyebrow">ME-MARRT / SPECIAL OFFERS</p>
        <h1>BIG<br />OFFERS<br /><span>ONLY.</span></h1>
        <p class="offer-subline">FREE GIFTS.<br />MEGA DEALS.<br />SPECIAL ACCESS.</p>
      </div>
      <button
        class="wheel-spin"
        id="wheel-spin"
        type="button"
        aria-label="Spin the offer wheel"
        disabled
      >
        SPIN
      </button>
      <aside class="offer-ticket" aria-labelledby="offer-result-label">
        <p id="offer-result-label">YOUR SPECIAL OFFER</p>
        <output id="wheel-result" aria-live="polite" aria-atomic="true"
          >FREE?<br />SPECIAL?<br />BOTH.</output
        >
        <button class="offer-view-button" id="offer-view-button" type="button" hidden>
          VIEW OFFER →
        </button>
        <span id="wheel-status">SPIN FOR YOUR OFFER</span>
      </aside>
      <div class="offer-bottom" aria-hidden="true">
        <span>100% GOOD OFFERS.</span><span>EVERY SPIN IS SPECIAL.</span>
      </div>
      <dialog
        class="daily-offer-dialog"
        id="daily-offer-dialog"
        aria-labelledby="daily-offer-title"
        aria-describedby="daily-offer-value"
      >
        <div class="daily-offer-card">
          <button
            class="daily-offer-close"
            id="daily-offer-close"
            type="button"
            aria-label="Close offer"
          >
            ×
          </button>
          <h2 id="daily-offer-title">YOUR OFFER TODAY</h2>
          <p class="daily-offer-value" id="daily-offer-value"></p>
          <a class="daily-offer-claim" id="daily-offer-claim" href="challenge.html">
            <span>CLAIM</span>
            <svg viewBox="0 0 40 28" aria-hidden="true" focusable="false">
              <path d="M2 14H35M23 3L35 14L23 25" />
            </svg>
          </a>
        </div>
      </dialog>
    </main>
    <script src="offer-wheel.js?v=academic-1"></script>
  </body>
</html>
